<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Công Việc KLM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f9; padding: 20px; }
        .card { max-width: 800px; margin: auto; border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-header { background: #0d6efd; color: white; border-radius: 15px 15px 0 0 !important; text-align: center; padding: 15px; }
        .table-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header"><h4>NHẬP BÁO CÁO MỚI</h4></div>
    <div class="card-body p-4">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nội dung</label>
                <input type="text" id="jobContent" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Nhân sự</label>
                <input type="text" id="worker" class="form-control">
            </div>
        </div>
        <button onclick="sendWorkReport()" id="btnSubmit" class="btn btn-primary w-100">GỬI BÁO CÁO</button>
    </div>
</div>

<div class="card">
    <div class="card-header bg-success"><h4>DANH SÁCH BÁO CÁO</h4></div>
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Lọc theo ngày:</label>
                <input type="date" id="filterDate" class="form-control" onchange="filterData()">
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <button class="btn btn-secondary w-100" onclick="loadData()">Tải lại dữ liệu</button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Ngày</th>
                        <th>Nội dung</th>
                        <th>Nhân sự</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const G_URL = "DÁN_LINK_WEB_APP_MỚI_CỦA_BẠN";
    let allData = [];

    // 1. Hàm gửi dữ liệu (doPost)
    async function sendWorkReport() {
        const btn = document.getElementById('btnSubmit');
        const params = new URLSearchParams();
        params.append('jobContent', document.getElementById('jobContent').value);
        params.append('worker', document.getElementById('worker').value);
        params.append('status', 'Đang thực hiện');

        btn.disabled = true;
        await fetch(G_URL, { method: "POST", mode: "no-cors", body: params.toString() });
        alert("Đã gửi! Đang cập nhật danh sách...");
        loadData(); // Tải lại bảng sau khi gửi
        btn.disabled = false;
    }

    // 2. Hàm lấy dữ liệu về (doGet)
    async function loadData() {
        try {
            const res = await fetch(G_URL);
            allData = await res.json();
            displayData(allData);
        } catch (e) {
            console.log("Lỗi tải dữ liệu: " + e);
        }
    }

    // 3. Hàm hiển thị dữ liệu vào bảng
    function displayData(data) {
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        data.forEach(item => {
            // Định dạng ngày từ Sheets sang d/m/y để dễ nhìn
            let dateObj = new Date(item.ngay);
            let dateStr = dateObj.toLocaleDateString('vi-VN');

            body.innerHTML += `
                <tr>
                    <td>${dateStr}</td>
                    <td>${item.noidung}</td>
                    <td>${item.nhansu}</td>
                    <td>${item.trangthai}</td>
                </tr>
            `;
        });
    }

    // 4. Hàm lọc theo ngày
    function filterData() {
        const filterVal = document.getElementById('filterDate').value; // Định dạng yyyy-mm-dd
        if (!filterVal) {
            displayData(allData);
            return;
        }

        const filtered = allData.filter(item => {
            let itemDate = new Date(item.ngay).toISOString().split('T')[0];
            return itemDate === filterVal;
        });
        displayData(filtered);
    }

    // Tự động tải dữ liệu khi mở web
    window.onload = loadData;
</script>

</body>
</html>
