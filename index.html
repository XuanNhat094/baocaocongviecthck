<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Công Việc THCK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f9; padding: 20px; }
        .card { max-width: 500px; margin: auto; border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .card-header { background: #0d6efd; color: white; border-radius: 15px 15px 0 0 !important; text-align: center; padding: 20px; }
        .btn-submit { width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; }
        #loading { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <h4 class="mb-0">NHẬP BÁO CÁO CÔNG VIỆC</h4>
    </div>
    <div class="card-body p-4">
        <div class="mb-3">
            <label class="form-label">Ngày thực hiện</label>
            <input type="date" id="ngay" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Nội dung công việc</label>
            <textarea id="noidung" class="form-control" rows="3" placeholder="Nhập nội dung..."></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <select id="trangthai" class="form-select">
                <option value="Hoàn thành">✅ Hoàn thành</option>
                <option value="Đang thực hiện">🔵 Đang thực hiện</option>
                <option value="Chưa bắt đầu">⚪ Chưa bắt đầu</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Nhân sự thực hiện</label>
            <input type="text" id="nhansu" class="form-control" placeholder="Tên nhân viên">
        </div>

        <div class="mb-3">
            <label class="form-label">Ghi chú</label>
            <input type="text" id="ghichu" class="form-control" placeholder="Ghi chú thêm">
        </div>

        <button onclick="sendWorkReport()" id="btnSubmit" class="btn btn-primary btn-submit">
            <span id="btnText">GỬI BÁO CÁO</span>
            <span id="loading" class="spinner-border spinner-border-sm"></span>
        </button>
    </div>
</div>

<script>
    function sendReport() {
    const btn = document.getElementById('btnSend');
    const G_URL = "https://script.google.com/macros/s/AKfycbzwW5Taa_YOZ1DF_mJGQ4-UStSUCg8WYzldkC_v1nwianvF3oUdsA0n9x04jDI4DdrB0A/exec";

    // Lấy dữ liệu từ Form
    const jobContent = document.getElementById('jobContent').value;
    const worker = document.getElementById('worker').value;
    const status = document.getElementById('status').value;
    const note = document.getElementById('note').value;

    if(!jobContent || !worker) return alert("Vui lòng điền nội dung và tên!");

    btn.disabled = true;
    btn.innerText = "Đang gửi...";

    // Đóng gói dữ liệu dạng URL-Encoded (Cực kỳ ổn định)
    const params = new URLSearchParams();
    params.append('jobContent', jobContent);
    params.append('worker', worker);
    params.append('status', status);
    params.append('note', note);

    fetch(G_URL, {
        method: "POST",
        mode: "no-cors", // Bắt buộc để không bị chặn bởi GitHub/CORS
        cache: "no-cache",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: params.toString()
    })
    .then(() => {
        // Lưu ý: no-cors luôn nhảy vào đây kể cả khi có lỗi, 
        // nhưng dữ liệu sẽ vào Sheets nếu link App Script đúng.
        alert("🚀 Đã phát lệnh gửi! Hãy kiểm tra Sheets ngay.");
        document.getElementById('jobContent').value = "";
        document.getElementById('note').value = "";
    })
    .catch(err => alert("Lỗi: " + err))
    .finally(() => {
        btn.disabled = false;
        btn.innerText = "GỬI BÁO CÁO";
    });
}
</script>

</body>
</html>
