<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Công Việc THCK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon.ico">
    <style>
        body { background-color: #f4f7f9; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { max-width: 650px; margin: auto; border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .card-header { background: #0d6efd; color: white; border-radius: 15px 15px 0 0 !important; text-align: center; padding: 15px; }
        .btn-submit { width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; }
        #loadingSpinner { display: none; }
        .table-card { max-width: 950px; }
        .badge { font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <h4 class="mb-0">NHẬP BÁO CÁO CÔNG VIỆC</h4>
    </div>
    <div class="card-body p-4">
        <div class="mb-3">
            <label class="form-label">Ngày thực hiện</label>
            <input type="date" id="ngay" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Nội dung công việc</label>
            <textarea id="noidung" class="form-control" rows="3" placeholder="Nhập nội dung..."></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <select id="trangthai" class="form-select">
                <option value="Hoàn thành">✅ Hoàn thành</option>
                <option value="Đang thực hiện">🔵 Đang thực hiện</option>
                <option value="Chưa bắt đầu">⚪ Chưa bắt đầu</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Nhân sự thực hiện</label>
            <input type="text" id="nhansu" class="form-control" placeholder="Tên nhân viên">
        </div>
        <div class="mb-3">
            <label class="form-label">Ghi chú</label>
            <input type="text" id="ghichu" class="form-control" placeholder="Ghi chú thêm">
        </div>
        <button onclick="sendWorkReport()" id="btnSubmit" class="btn btn-primary btn-submit">
            <span id="btnText">GỬI BÁO CÁO</span>
            <span id="loadingSpinner" class="spinner-border spinner-border-sm"></span>
        </button>
    </div>
</div>

<div class="card table-card">
    <div class="card-header bg-success text-white">
        <h4 class="mb-0">20 BÁO CÁO GẦN NHẤT</h4>
    </div>
    <div class="card-body">
        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <input type="date" id="filterDate" class="form-control" onchange="filterData()">
            </div>
            <div class="col-md-4">
                <button class="btn btn-outline-secondary w-100" onclick="loadData()">Tải lại dữ liệu</button>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark text-center">
                    <tr>
                        <th>STT</th>
                        <th>Ngày</th>
                        <th>Nội dung</th>
                        <th>Trạng thái</th>
                        <th>Nhân sự</th>
                        <th>Ghi chú</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="text-center">
                    <tr><td colspan="6">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const G_URL = "https://script.google.com/macros/s/AKfycbzwW5Taa_YOZ1DF_mJGQ4-UStSUCg8WYzldkC_v1nwianvF3oUdsA0n9x04jDI4DdrB0A/exec";
    let allData = [];

    document.getElementById('ngay').valueAsDate = new Date();

    function sendWorkReport() {
        const btn = document.getElementById('btnSubmit');
        const text = document.getElementById('btnText');
        const loader = document.getElementById('loadingSpinner');

        const params = new URLSearchParams();
        params.append('jobContent', document.getElementById('noidung').value);
        params.append('worker', document.getElementById('nhansu').value);
        params.append('status', document.getElementById('trangthai').value);
        params.append('note', document.getElementById('ghichu').value);
        params.append('customDate', document.getElementById('ngay').value);

        if(!document.getElementById('noidung').value || !document.getElementById('nhansu').value) {
            return alert("Vui lòng nhập đầy đủ Nội dung và Nhân sự!");
        }

        btn.disabled = true;
        text.innerText = "ĐANG GỬI...";
        loader.style.display = "inline-block";

        fetch(G_URL, {
            method: "POST",
            mode: "no-cors",
            body: params.toString(),
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        })
        .then(() => {
            alert("✅ Đã gửi thành công!");
            document.getElementById('noidung').value = "";
            document.getElementById('ghichu').value = "";
            loadData();
        })
        .catch(err => alert("Lỗi: " + err))
        .finally(() => {
            btn.disabled = false;
            text.innerText = "GỬI BÁO CÁO";
            loader.style.display = "none";
        });
    }

    async function loadData() {
        try {
            const res = await fetch(G_URL);
            allData = await res.json();
            displayData(allData);
        } catch (e) {
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-danger">Lỗi tải dữ liệu</td></tr>`;
        }
    }

    function displayData(data) {
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        
        // Đảo ngược để mới nhất lên đầu và lấy 20 mục
        const displayRows = [...data].reverse().slice(0, 20);

        displayRows.forEach(item => {
            let dateStr = item.ngay ? new Date(item.ngay).toLocaleDateString('vi-VN') : "N/A";
            let statusBadge = item.trangthai === 'Hoàn thành' ? 'bg-success' : 
                              (item.trangthai === 'Đang thực hiện' ? 'bg-primary' : 'bg-secondary');
            
            body.innerHTML += `
                <tr>
                    <td>${item.stt || ""}</td>
                    <td>${dateStr}</td>
                    <td class="text-start">${item.noidung || ""}</td>
                    <td><span class="badge ${statusBadge}">${item.trangthai || ""}</span></td>
                    <td>${item.nhansu || ""}</td>
                    <td class="text-muted small">${item.ghichu || ""}</td>
                </tr>
            `;
        });
    }

    function filterData() {
        const filterVal = document.getElementById('filterDate').value;
        if (!filterVal) {
            displayData(allData);
            return;
        }
        const filtered = allData.filter(item => {
            if(!item.ngay) return false;
            return new Date(item.ngay).toISOString().split('T')[0] === filterVal;
        });
        displayData(filtered);
    }

    window.onload = loadData;
</script>
</body>
</html>
