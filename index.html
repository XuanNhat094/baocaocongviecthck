<div class="card">
    <h2>📝 BÁO CÁO CÔNG VIỆC</h2>
    
    <div class="form-group">
        <label>Nội dung công việc:</label>
        <textarea id="jobContent" rows="3" placeholder="Nhập chi tiết công việc..."></textarea>
    </div>

    <div class="form-group">
        <label>Nhân sự thực hiện:</label>
        <input type="text" id="worker" placeholder="Tên nhân viên">
    </div>

    <div class="form-group">
        <label>Trạng thái:</label>
        <select id="status">
            <option value="Đang thực hiện">⏳ Đang thực hiện</option>
            <option value="Đã hoàn thành">✅ Đã hoàn thành</option>
            <option value="Chờ vật tư">🚫 Chờ vật tư</option>
        </select>
    </div>

    <div class="form-group">
        <label>Ghi chú (Cột F):</label>
        <input type="text" id="note" placeholder="Thông tin thêm nếu có...">
    </div>

    <button onclick="sendReport()" id="btnSend">GỬI LÊN HỆ THỐNG</button>
    <p id="msg" style="text-align:center; display:none; font-weight:bold;"></p>
</div>

<script>
    const G_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwW5Taa_YOZ1DF_mJGQ4-UStSUCg8WYzldkC_v1nwianvF3oUdsA0n9x04jDI4DdrB0A/exec";

    async function sendReport() {
        const btn = document.getElementById('btnSend');
        const msg = document.getElementById('msg');
        
        const data = {
            jobContent: document.getElementById('jobContent').value,
            worker: document.getElementById('worker').value,
            status: document.getElementById('status').value,
            note: document.getElementById('note').value
        };

        if(!data.jobContent || !data.worker) {
            alert("Vui lòng điền nội dung và tên người làm!");
            return;
        }

        btn.disabled = true;
        msg.innerText = "⏳ Đang xử lý...";
        msg.style.display = "block";

        try {
            // Khi chạy từ GitHub Pages, fetch cần mode: 'no-cors' để vượt qua chính sách bảo mật
            await fetch(G_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(data)
            });
            
            alert("✅ Gửi thành công!");
            document.getElementById('jobContent').value = "";
            document.getElementById('note').value = "";
            msg.innerText = "✅ Đã lưu vào Sheets!";
        } catch (e) {
            alert("❌ Lỗi: " + e);
            msg.innerText = "❌ Gửi thất bại!";
        } finally {
            btn.disabled = false;
        }
    }
</script>
