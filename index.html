<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập dữ liệu</title>
</head>
<body>

  <h2>Form nhập dữ liệu</h2>

  <form id="myForm">
    <label>Ngày tháng:</label><br>
    <input type="date" id="lastDate"><br><br>

    <label>Nội dung:</label><br>
    <input type="text" id="worker"><br><br>

    <label>Họ tên:</label><br>
    <input type="text" id="name"><br><br>

    <label>Ghi chú:</label><br>
    <input type="text" id="cycle"><br><br>

    <button type="submit">Gửi</button>
  </form>

  <p id="status"></p>

  <script>
    document.getElementById("myForm").addEventListener("submit", function(e) {
      e.preventDefault();

      var data = {
        lastDate: document.getElementById("lastDate").value,
        worker: document.getElementById("worker").value,
        name: document.getElementById("name").value,
        cycle: document.getElementById("cycle").value
      };

      fetch("https://script.google.com/macros/s/AKfycbzwW5Taa_YOZ1DF_mJGQ4-UStSUCg8WYzldkC_v1nwianvF3oUdsA0n9x04jDI4DdrB0A/exec", {
        method: "POST",
        body: JSON.stringify(data),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then(res => res.text())
      .then(result => {
        document.getElementById("status").innerText = result;
        document.getElementById("myForm").reset();
      })
      .catch(err => {
        document.getElementById("status").innerText = "Lỗi gửi dữ liệu!";
      });
    });
  </script>

</body>
</html>
