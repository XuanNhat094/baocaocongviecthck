<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Công Việc KLM</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/4345/4345517.png">
    <style>
        :root { --primary: #1a73e8; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .card { background: white; width: 100%; max-width: 450px; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; margin-top: 0; text-transform: uppercase; font-size: 1.2rem; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-weight: 600; color: #444; font-size: 0.9rem; }
        input, select, textarea { 
            width: 100%; padding: 12px; border: 1.5px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; transition: 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
        
        button { 
            width: 100%; padding: 16px; background: var(--primary); color: white; border: none; 
            border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        button:hover { background: #1765cc; }
        button:disabled { background: #bdc1c6; cursor: not-allowed; }
        
        #loading { text-align: center; margin-top: 15px; font-weight: bold; color: var(--primary); display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>📝 BÁO CÁO CÔNG VIỆC</h2>
    
    <div class="form-group">
        <label>Nội dung công việc:</label>
        <textarea id="jobContent" rows="3" placeholder="Mô tả chi tiết công việc đã làm..."></textarea>
    </div>

    <div class="form-group">
        <label>Nhân sự thực hiện:</label>
        <input type="text" id="worker" placeholder="Tên nhân viên">
    </div>

    <div class="form-group">
        <label>Trạng thái:</label>
        <select id="status">
            <option value="Đang thực hiện">⏳ Đang thực hiện</option>
            <option value="Đã hoàn thành">✅ Đã hoàn thành</option>
            <option value="Chờ vật tư/Tạm dừng">🚫 Chờ vật tư/Tạm dừng</option>
        </select>
    </div>

    <div class="form-group">
        <label>Ghi chú:</label>
        <input type="text" id="note" placeholder="Thông tin bổ sung (nếu có)...">
    </div>

    <button onclick="sendReport()" id="btnSend">GỬI BÁO CÁO</button>
    <div id="loading">⌛ Đang lưu vào hệ thống...</div>
</div>

<script>
   async function sendReport() {
    const btn = document.getElementById('btnSend');
    const url = "LINK_WEB_APP_MỚI_CỦA_BẠN"; // Dán link từ Bước 2 vào đây

    const data = {
        jobContent: document.getElementById('jobContent').value,
        worker: document.getElementById('worker').value,
        status: document.getElementById('status').value,
        note: document.getElementById('note').value
    };

    btn.disabled = true;
    btn.innerText = "ĐANG GỬI...";

    try {
        // Sử dụng fetch mặc định (không dùng no-cors để xem lỗi thật)
        const response = await fetch(url, {
            method: "POST",
            body: JSON.stringify(data)
        });

        // Với Google Script, dữ liệu thường vào Sheets ngay cả khi báo lỗi CORS
        alert("Kiểm tra Sheets! Dữ liệu thường sẽ xuất hiện sau 2-3 giây.");
        
        document.getElementById('jobContent').value = "";
    } catch (e) {
        // Nếu vẫn lỗi, thử lại với phương án dự phòng
        navigator.sendBeacon(url, JSON.stringify(data));
        alert("Đã gửi qua phương thức dự phòng (Beacon). Hãy kiểm tra Sheets!");
    } finally {
        btn.disabled = false;
        btn.innerText = "GỬI BÁO CÁO";
    }
}
</script>

</body>
</html>
