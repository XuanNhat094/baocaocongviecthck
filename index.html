<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Công Việc THCK</title>
	<link rel="icon" type="ico" href="icon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="JS/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon.ico">
    <link href="CSS/style.css" rel="stylesheet" type="text/css">
</head>
<body>
<div id="loginOverlay">
    <div class="login-box">
        <h4 class="mb-3" style="text-align: center">🔐 ĐĂNG NHẬP</h4>
        <p class="text-muted small">Vui lòng nhập họ tên để tiếp tục báo cáo</p>
        <input type="text" id="userNameInput" class="form-control mb-3" placeholder="Nhập tên của bạn...">
		<p class="text-muted small">Vui lòng nhập mật khẩu để tiếp tục</p>
        <input type="password" id="accessCode" class="form-control mb-3" placeholder="Nhập mật khẩu...">
        <button onclick="checkLogin()" class="btn btn-primary w-100">ĐĂNG NHẬP</button>
        <p id="loginError" class="text-danger small mt-2" style="display:none;">Mật khẩu không đúng!</p>
    </div>
</div>
	<!-- Nút mở menu -->
<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<!-- Nội dung Menu ẩn -->
<div id="sideMenu" class="side-menu">
    <button class="close-btn" onclick="toggleMenu()">✘</button>
    <div class="menu-content">
        <h5 class="text-white mb-4">DANH MỤC</h5>
        <a href="index.html" onclick="toggleMenu()">🏠 Trang chủ</a>
        <a href="danh-muc-thiet-bi.html" onclick="loadData(); toggleMenu()">➥ Danh mục thiết bị</a>
		<a href="bao-tri-dinh-ky.html" onclick="loadData(); toggleMenu()">➥ Bảo trì định kỳ</a>
        <a href="#" onclick="window.location.reload()">➥ Tải lại trang</a>
        <hr class="text-white">
        <a href="index.html" onclick="localStorage.removeItem('isLoggedIn'); location.reload();" class="text-danger">🚪 Đăng xuất</a>
    </div>
</div>
<div class="card">
    <div class="card-header">
        <h4 class="mb-0">BÁO CÁO CÔNG VIỆC BT-THCK</h4>
    </div>
    <div class="card-body p-4">
        <div class="mb-3">
            <label class="form-label">Ngày thực hiện</label>
            <input type="date" id="ngay" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Nội dung công việc</label>
            <textarea id="noidung" class="form-control" rows="3" placeholder="Nhập nội dung..."></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <select id="trangthai" class="form-select">
                <option value="Hoàn thành">✅ Hoàn thành</option>
                <option value="Đang thực hiện">🔵 Đang thực hiện</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Nhân sự thực hiện</label>
            <input type="text" id="nhansu" class="form-control" placeholder="Tên nhân viên">
        </div>
        <div class="mb-3">
    		<label class="form-label">Tiến độ (%)</label>
    		<div class="d-flex align-items-center gap-2">
        	<input type="number" id="ghichu" class="form-control" 
               min="0" max="100" value="100" 
               style="width: 80px;" oninput="syncRange(this.value)">     
        	<input type="range" id="progressRange" class="form-range" 
               min="0" max="100" value="100" 
               oninput="syncInput(this.value)">
    </div>
</div>
        <button onclick="sendWorkReport()" id="btnSubmit" class="btn btn-primary btn-submit">
            <span id="btnText">GỬI BÁO CÁO</span>
            <span id="loadingSpinner" class="spinner-border spinner-border-sm"></span>
        </button>
    </div>
</div>
    <div class="card-body">
    <!-- 1. Ô chọn ngày báo cáo -->
    <div class="mb-3">
        <label class="form-label fw-bold">Chọn ngày báo cáo:</label>
        <input type="date" id="filterDate" class="form-control" onchange="loadData()">
    </div>

    <!-- 2. Nhóm nút Làm mới và Sao chép (Nằm dưới ngày và trên báo cáo) -->
    <div class="row g-2 mb-3">
        <div class="col-6">
            <button class="btn btn-primary w-100" onclick="loadData()">
                🔄 Làm mới
            </button>
        </div>
        <div class="col-6">
            <button class="btn btn-primary w-100" onclick="copyReport()">
                📋 Sao chép
            </button>
        </div>
    </div>

    <!-- 3. Ô hiển thị nội dung báo cáo -->
    <div class="report-container">
        <textarea id="reportText" class="form-control bg-light" rows="12" readonly 
                  style="font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; font-size: 14px;"></textarea>
    </div>
</div>

<script src="JS/script.js"></script>

</body>
</html>
