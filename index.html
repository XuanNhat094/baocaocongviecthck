<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Công Việc - THCK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { max-width: 550px; margin: auto; border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .card-header { background: #007bff; color: white; border-radius: 15px 15px 0 0 !important; text-align: center; padding: 25px; }
        .form-label { font-weight: bold; color: #495057; margin-top: 10px; }
        .btn-submit { width: 100%; padding: 15px; font-weight: bold; font-size: 1.1rem; border-radius: 10px; margin-top: 20px; transition: 0.3s; }
        .loading-spinner { display: none; margin-left: 10px; }
        input:focus, textarea:focus, select:focus { border-color: #007bff; box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25); }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <h3 class="mb-0">CẬP NHẬT BÁO CÁO CÔNG VIỆC</h3>
    </div>
    <div class="card-body p-4">
        <div class="mb-3">
            <label for="ngay" class="form-label">Ngày thực hiện</label>
            <input type="date" id="ngay" class="form-control">
        </div>

        <div class="mb-3">
            <label for="noidung" class="form-label">Nội dung công việc</label>
            <textarea id="noidung" class="form-control" rows="4" placeholder="Ví dụ: Vận hành máy nén khí, bảo trì laser..."></textarea>
        </div>

        <div class="mb-3">
            <label for="trangthai" class="form-label">Trạng thái</label>
            <select id="trangthai" class="form-select">
                <option value="Chưa bắt đầu">⚪ Chưa bắt đầu</option>
                <option value="Đang thực hiện">🔵 Đang thực hiện</option>
                <option value="Hoàn thành" selected>✅ Hoàn thành</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="nhansu" class="form-label">Nhân sự thực hiện</label>
            <input type="text" id="nhansu" class="form-control" placeholder="Nhập tên người thực hiện">
        </div>

        <div class="mb-3">
            <label for="ghichu" class="form-label">Ghi chú</label>
            <input type="text" id="ghichu" class="form-control" placeholder="Lưu ý thêm nếu có">
        </div>

        <button onclick="sendReport()" id="btnSubmit" class="btn btn-primary btn-submit">
            <span id="btnText">GỬI BÁO CÁO</span>
            <div id="loading" class="spinner-border spinner-border-sm loading-spinner" role="status"></div>
        </button>
    </div>
</div>

<script>
    // URL Web App của bạn
	const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzwW5Taa_YOZ1DF_mJGQ4-UStSUCg8WYzldkC_v1nwianvF3oUdsA0n9x04jDI4DdrB0A/exec";

    // Tự động điền ngày hiện tại
    window.onload = () => {
        document.getElementById('ngay').value = new Date().toISOString().split('T')[0];
    };

    function toggleLoading(isLoading) {
        const btn = document.getElementById('btnSubmit');
        const text = document.getElementById('btnText');
        const loader = document.getElementById('loading');
        
        btn.disabled = isLoading;
        loader.style.display = isLoading ? "inline-block" : "none";
        text.innerText = isLoading ? "ĐANG GỬI DỮ LIỆU..." : "GỬI BÁO CÁO";
    }

    async function sendReport() {
        const data = {
            action: "updateReport",
            ngay: document.getElementById('ngay').value,
            noidung: document.getElementById('noidung').value,
            trangthai: document.getElementById('trangthai').value,
            nhansu: document.getElementById('nhansu').value,
            ghichu: document.getElementById('ghichu').value
        };

        // Kiểm tra dữ liệu bắt buộc
        if (!data.ngay || !data.noidung || !data.nhansu) {
            alert("⚠️ Vui lòng điền đầy đủ các thông tin chính!");
            return;
        }

        if (!confirm(`Xác nhận gửi báo cáo cho: ${data.nhansu}?`)) return;

        toggleLoading(true);

        try {
            // Gửi dữ liệu qua fetch POST
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // Bắt buộc khi dùng GitHub Pages
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(data)
            });

            // Do 'no-cors' không đọc được response trả về, ta mặc định là thành công sau khi gửi xong
            alert("🎉 Yêu cầu đã được gửi thành công!");
            
            // Xóa trắng ô nội dung và ghi chú sau khi gửi
            document.getElementById('noidung').value = "";
            document.getElementById('ghichu').value = "";
            
        } catch (error) {
            console.error(error);
            alert("❌ Có lỗi kết nối: " + error.message);
        } finally {
            toggleLoading(false);
        }
    }
</script>

</body>
</html>
