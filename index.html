<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nhập Báo Cáo</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; display: block; }
        button { width: 100%; padding: 10px; background: blue; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h3>NHẬP DỮ LIỆU BÁO CÁO</h3>
    <input type="date" id="ngay">
    <textarea id="noidung" placeholder="Nội dung công việc"></textarea>
    <select id="trangthai">
        <option value="Hoàn thành">Hoàn thành</option>
        <option value="Đang thực hiện">Đang thực hiện</option>
    </select>
    <input type="text" id="nhansu" placeholder="Tên nhân sự">
    <input type="text" id="ghichu" placeholder="Ghi chú">

    <button onclick="sendData()">GỬI DỮ LIỆU</button>

    <script>
        // Dán URL Web App của bạn vào đây
        const URL = "https://script.google.com/macros/s/AKfycbzwW5Taa_YOZ1DF_mJGQ4-UStSUCg8WYzldkC_v1nwianvF3oUdsA0n9x04jDI4DdrB0A/exec";

        async function sendData() {
            const payload = {
                ngay: document.getElementById('ngay').value,
                noidung: document.getElementById('noidung').value,
                trangthai: document.getElementById('trangthai').value,
                nhansu: document.getElementById('nhansu').value,
                ghichu: document.getElementById('ghichu').value
            };

            try {
                // Gửi dữ liệu qua Google Sheets
                await fetch(URL, {
                    method: "POST",
                    mode: "no-cors", // Bắt buộc cho GitHub Pages
                    body: JSON.stringify(payload)
                });

                alert("Đã gửi dữ liệu thành công!");
                document.getElementById('noidung').value = "";
            } catch (e) {
                alert("Lỗi kết nối!");
            }
        }
    </script>
</body>
</html>
