    <style>
        body { background-color: #f4f7f9; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { max-width: 650px; margin: auto; border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .card-header { background: #0d6efd; color: white; border-radius: 15px 15px 0 0 !important; text-align: center; padding: 15px; }
        .btn-submit { width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; }
        #loadingSpinner { display: none; }
        .table-card { max-width: 950px; }
        .badge { font-size: 0.85rem; }

<body>

<div class="card">
    <div class="card-header">
        <h4 class="mb-0">NHẬP BÁO CÁO CÔNG VIỆC</h4>
    </div>
    <div class="card-body p-4">
        <div class="mb-3">
            <label class="form-label">Ngày thực hiện</label>
            <input type="date" id="ngay" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Nội dung công việc</label>
            <textarea id="noidung" class="form-control" rows="3" placeholder="Nhập nội dung..."></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <select id="trangthai" class="form-select">
                <option value="Hoàn thành">✅ Hoàn thành</option>
                <option value="Đang thực hiện">🔵 Đang thực hiện</option>
                <option value="Chưa bắt đầu">⚪ Chưa bắt đầu</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Nhân sự thực hiện</label>
            <input type="text" id="nhansu" class="form-control" placeholder="Tên nhân viên">
        </div>
        <div class="mb-3">
            <label class="form-label">Ghi chú</label>
            <input type="text" id="ghichu" class="form-control" placeholder="Ghi chú thêm">
        </div>
        <button onclick="sendWorkReport()" id="btnSubmit" class="btn btn-primary btn-submit">
            <span id="btnText">GỬI BÁO CÁO</span>
            <span id="loadingSpinner" class="spinner-border spinner-border-sm"></span>
        </button>
    </div>
</div>

    <div class="card-body">
    <div class="mb-3">
        <label class="form-label fw-bold">Chọn ngày báo cáo:</label>
        <input type="date" id="filterDate" class="form-control" onchange="loadData()">
    </div>

    <div class="position-relative">
        <button class="btn btn-sm btn-primary position-absolute end-0 top-0 m-2" onclick="copyReport()">
            <i class="bi bi-clipboard"></i> Sao chép
        </button>
        <textarea id="reportText" class="form-control bg-light" rows="10" readonly 
            style="font-family: 'Courier New', Courier, monospace; white-space: pre-wrap;"></textarea>
    </div>
</div>

</div>
<script>
    // Link API từ Google Apps Script của bạn
    const G_URL = "https://script.google.com/macros/s/AKfycbzwW5Taa_YOZ1DF_mJGQ4-UStSUCg8WYzldkC_v1nwianvF3oUdsA0n9x04jDI4DdrB0A/exec";
    let allData = [];

    // Tự động điền ngày hôm nay khi vừa mở trang
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('ngay').value = today;
        document.getElementById('filterDate').value = today;
        loadData(); // Tải dữ liệu ngay khi mở trang
    };

    // --- 1. HÀM GỬI BÁO CÁO MỚI ---
    function sendWorkReport() {
        const btn = document.getElementById('btnSubmit');
        const text = document.getElementById('btnText');
        const loader = document.getElementById('loadingSpinner');

        const noidung = document.getElementById('noidung').value;
        const nhansu = document.getElementById('nhansu').value;

        if(!noidung || !nhansu) {
            return alert("⚠️ Vui lòng nhập đầy đủ Nội dung và Nhân sự!");
        }

        const params = new URLSearchParams();
        params.append('jobContent', noidung);
        params.append('worker', nhansu);
        params.append('status', document.getElementById('trangthai').value);
        params.append('note', document.getElementById('ghichu').value);
        params.append('customDate', document.getElementById('ngay').value);

        // Hiệu ứng đang gửi
        btn.disabled = true;
        text.innerText = "ĐANG GỬI...";
        loader.style.display = "inline-block";

        fetch(G_URL, {
            method: "POST",
            mode: "no-cors",
            body: params.toString(),
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        })
        .then(() => {
            alert("✅ Đã gửi thành công!");
            document.getElementById('noidung').value = "";
            document.getElementById('ghichu').value = "";
            loadData(); // Cập nhật lại danh sách bên dưới
        })
        .catch(err => alert("❌ Lỗi: " + err))
        .finally(() => {
            btn.disabled = false;
            text.innerText = "GỬI BÁO CÁO";
            loader.style.display = "none";
        });
    }

    // --- 2. HÀM TẢI DỮ LIỆU TỪ SHEETS ---
    async function loadData() {
        const reportArea = document.getElementById('reportText');
        reportArea.value = "⏳ Đang tải dữ liệu...";

        try {
            const res = await fetch(G_URL);
            allData = await res.json();
            filterData(); // Tải xong thì lọc theo ngày đang chọn
        } catch (e) {
            reportArea.value = "❌ Không thể tải dữ liệu. Vui lòng kiểm tra kết nối mạng!";
            console.error(e);
        }
    }

    // --- 3. HÀM LỌC VÀ TẠO VĂN BẢN TXT (BỎ DẤU NGOẶC KÉP) ---
    function filterData() {
        const filterVal = document.getElementById('filterDate').value;
        const reportArea = document.getElementById('reportText');
        
        if (!filterVal) {
            reportArea.value = "Vui lòng chọn ngày.";
            return;
        }

        // Định dạng ngày hiển thị DD/MM/YYYY
        const d = filterVal.split('-');
        const displayDate = `${d[2]}/${d[1]}/${d[0]}`;

        // Lọc dữ liệu theo ngày đã chọn
        const filtered = allData.filter(item => {
            if(!item.ngay) return false;
            const itemDate = new Date(item.ngay).toISOString().split('T')[0];
            return itemDate === filterVal;
        });

        // Tạo nội dung văn bản để copy
        let content = `Báo cáo công việc ngày ${displayDate}\n`;
        content += `----------------------------------\n`;

        if (filtered.length === 0) {
            content += "(Chưa có dữ liệu báo cáo cho ngày này)";
        } else {
            filtered.forEach(item => {
                const nd = item.noidung || "";
                const ns = item.nhansu || "";
                const gc = item.ghichu || "";
                // Định dạng: - Nội dung Nhân sự Ghi chú (Đã bỏ dấu ngoặc kép)
                content += `- ${nd} ${ns} ${gc}\n`;
            });
        }

        reportArea.value = content;
    }

    // --- 4. HÀM SAO CHÉP NHANH ---
    function copyReport() {
        const copyText = document.getElementById("reportText");
        
        if (!copyText.value || copyText.value.includes("Đang tải")) return;

        copyText.select();
        copyText.setSelectionRange(0, 99999); // Hỗ trợ mobile

        navigator.clipboard.writeText(copyText.value).then(() => {
            // Hiệu ứng đổi màu nút khi thành công
            const btn = document.querySelector('button[onclick="copyReport()"]');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = "✅ Đã chép";
            btn.classList.replace('btn-primary', 'btn-success');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('btn-success', 'btn-primary');
            }, 2000);
        }).catch(err => {
            alert("Lỗi khi sao chép: " + err);
        });
    }
</script>

</body>
